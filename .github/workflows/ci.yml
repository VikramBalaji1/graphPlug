name: CI

on:
  push:
    branches: [main]
    # A version tag (v0.2.1) also publishes; see the publish job.
    tags: ['v*']
  pull_request:

jobs:
  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The floor declared in pyproject.toml, and current.
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e .
      - run: python -m unittest discover -s tests -v

  wheel:
    name: build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      # Pure Python, so one wheel serves every platform. twine check is what PyPI would reject.
      - run: pip install build twine && python -m build && twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    # PyPI's trusted publisher is registered for this file (ci.yml) with no environment, so this
    # job uploads with a short-lived token GitHub mints for it. Nothing is stored as a secret.
    name: publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: wheel
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # A version can be uploaded once, ever, so refuse a tag that does not match the build.
      - name: tag matches __version__
        run: |
          version="${GITHUB_REF_NAME#v}"
          ls dist/graphplug-"$version"-py3-none-any.whl dist/graphplug-"$version".tar.gz
      - uses: pypa/gh-action-pypi-publish@release/v1
