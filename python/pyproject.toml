[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "msgraph-simple"
version = "0.1.0"
description = "Unified Microsoft Entra ID authentication and Microsoft Graph request handling."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Arvind Vikram" }]

# Deliberately empty. A package whose selling point is "plug and play" should not begin with a
# dependency resolution; everything the binding needs is in the standard library.
dependencies = []

# The wheel is platform-specific; see setup.py. Build it with the glibc floor of the image the
# library came from:
#     python -m build --wheel python/ #            -C--build-option=--plat-name=manylinux_2_34_x86_64
[tool.setuptools.packages.find]
include = ["msgraph_simple*"]

[tool.setuptools.package-data]
msgraph_simple = ["py.typed", "_lib/*"]
