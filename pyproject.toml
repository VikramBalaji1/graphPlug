[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "graphplug"
version = "0.2.0"
description = "Plug-and-play Graph API for Python: mail, calendar, files, teams, users and generic requests."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vikram Balaji", email="vikram.x.balaji@gmail.com" }]

# Microsoft's own libraries do the work this package would otherwise have to:
#   azure-identity  credential acquisition, caching and refresh
#   msgraph-core    the supported middleware pipeline (retry, Retry-After, redirect, telemetry)
# msgraph-sdk is deliberately NOT used: its dependency tree does not resolve in practice.
dependencies = [
    "azure-identity>=1.19",
    "msgraph-core>=1.3",
]

[tool.setuptools.packages.find]
include = ["graphplug*"]

[tool.setuptools.package-data]
graphplug = ["py.typed"]
